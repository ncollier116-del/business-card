<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#315b50">
    <title>Business Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <article class="business-card" aria-label="Business card preview">
            <div class="card-art" aria-hidden="true">
                <img class="portrait portrait-back" src="Me-animation/IMG_1619.PNG" alt="">
                <img class="portrait portrait-front" src="Me-animation/IMG_1620.PNG" alt="">
            </div>
            <div class="card-copy">
                <p class="card-label">Fine Artist</p>
                <h1>nikki<br>zines</h1>
                <p class="card-subtitle">Why not live more creatively?</p>
                <span class="card-mark" aria-hidden="true"></span>
            </div>
        </article>
    </main>
</body>
</html>
